<!DOCTYPE html>

<body class="text-white bg-black">
    <!-- Header -->
    <header class="flex justify-between items-center max-w-300 m-auto p-5">
        <img src="./img/Logo.png" alt="">
        <nav class="flex gap-5 items-center">
            <a href="" class="text-white text-[18px] font-medium"> Home </a>

    <section class="flex justify-between items-center max-w-300 m-auto">
